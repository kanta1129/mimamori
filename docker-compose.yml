services:
  # --- 1. データベース (MySQL) ---
  db:
    image: mysql:8.0
    container_name: monitoring-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: monitoring_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # --- 2. バックエンド (Python/FastAPI) ---
  backend:
    build: ./backend
    container_name: monitoring-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=db  # コンテナ名「db」で接続する設定
    depends_on:
      db:
        condition: service_healthy

  # --- 3. フロントエンド (React/Vite) ---
  frontend:
    build: ./frontend
    container_name: monitoring-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host # 外部アクセス許可オプション
    depends_on:
      - backend

volumes:
  db_data: